<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LOVE MAYOYO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            min-height: 100vh;
            /* 绚丽渐变背景动画 */
            background: linear-gradient(-45deg, #ff0080, #ff8c00, #00d4ff, #9927ff);
            background-size: 400% 400%;
            animation: bgGradient 12s ease infinite;
            color: #fff;
            overflow-x: hidden;
        }

        @keyframes bgGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 粒子光斑装饰 */
        .light-dot {
            position: fixed;
            border-radius: 50%;
            filter: blur(12px);
            z-index: 0;
            animation: float 8s infinite ease-in-out;
        }
        .dot1 { width: 180px; height: 180px; background: rgba(255,255,255,0.3); top: 10%; left: 8%; animation-delay: 0s; }
        .dot2 { width: 240px; height: 240px; background: rgba(255,100,200,0.25); top: 60%; right: 10%; animation-delay: 2s; }
        .dot3 { width: 120px; height: 120px; background: rgba(100,220,255,0.3); bottom: 15%; left: 25%; animation-delay: 4s; }

        @keyframes float {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        /* 主标题 */
        .main-title {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,100,200,0.6);
            letter-spacing: 6px;
            animation: titleShine 3s ease infinite alternate;
        }
        @keyframes titleShine {
            from { filter: brightness(1); }
            to { filter: brightness(1.3); }
        }

        /* 副标题区域样式 */
        .sub-title-wrap {
            margin-bottom: 30px;
            padding: 18px 30px;
            display: inline-block;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .sub-line {
            font-size: 22px;
            margin: 10px 0;
            letter-spacing: 1px;
        }
        /* 单个职业区块，加宽左右间距 */
        .spec-block {
            display: inline-block;
            margin: 0 22px;
        }
        .wow-icon {
            display: inline-block;
            width: 26px;
            height: 26px;
            vertical-align: middle;
            margin: 0 6px;
            background: #f1c40f;
            border-radius: 6px;
            text-align: center;
            line-height: 26px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
        }
        .spec-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin: 0 5px;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 14px;
            color: #000;
            font-weight: bold;
        }
        .ele-sham { background: #0070dd; }
        .balance-druid { background: #ff7d0a; }
        .priest { background: #ffffff; }
        .dkt { background: #c41e3a; }

        .card-wrap {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .info-card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 35px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: all 0.4s ease;
        }
        .info-card:hover {
            transform: translateY(-10px);
            background: rgba(255,255,255,0.18);
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
        }

        .card-title {
            font-size: 24px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .card-text {
            font-size: 32px;
            font-weight: bold;
        }
        .small-text {
            font-size: 16px;
            margin-top: 12px;
            opacity: 0.8;
        }

        /* 倒计时数字样式 */
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }
        .count-item {
            background: rgba(255,255,255,0.15);
            padding: 12px 16px;
            border-radius: 12px;
            min-width: 70px;
        }
        .count-num {
            font-size: 36px;
            font-weight: bold;
        }
        .count-label {
            font-size: 14px;
            opacity: 0.8;
        }

        footer {
            margin-top: 80px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <!-- 浮动光斑装饰 -->
    <div class="light-dot dot1"></div>
    <div class="light-dot dot2"></div>
    <div class="light-dot dot3"></div>

    <div class="container">
        <h1 class="main-title">I LOVE MAYOYO</h1>

        <!-- 副标题区域 -->
        <div class="sub-title-wrap">
            <div class="sub-line">
                爱好 <span class="wow-icon">W</span> 魔兽世界
            </div>
            <div class="sub-line">
                公会：西津渡
            </div>
            <div class="sub-line">
                常驻职业：
                <span class="spec-block">
                    <span class="spec-icon ele-sham">萨</span>电萨 · 清野菜名
                </span>
                <span class="spec-block">
                    <span class="spec-icon balance-druid">德</span>鸟德 · 上白石萌音
                </span>
                <span class="spec-block">
                    <span class="spec-icon priest">牧</span>牧师 · 黑岛结菜
                </span>
                <span class="spec-block">
                    <span class="spec-icon dkt">DK</span>DKT · 上白石萌歌
                </span>
            </div>
        </div>

        <div class="card-wrap">
            <!-- 实时日期时间 -->
            <div class="info-card">
                <h3 class="card-title">📅 实时日期时间</h3>
                <div class="card-text" id="nowTime">加载中...</div>
                <div class="small-text" id="nowDate"></div>
            </div>

            <!-- 倒计时模块 -->
            <div class="info-card">
                <h3 class="card-title">⏳ 目标倒计时</h3>
                <div class="small-text">距离 2027年元旦</div>
                <div class="countdown-box" id="countBox">
                    <div class="count-item">
                        <div class="count-num" id="day">00</div>
                        <div class="count-label">天</div>
                    </div>
                    <div class="count-item">
                        <div class="count-num" id="hour">00</div>
                        <div class="count-label">时</div>
                    </div>
                    <div class="count-item">
                        <div class="count-num" id="min">00</div>
                        <div class="count-label">分</div>
                    </div>
                    <div class="count-item">
                        <div class="count-num" id="sec">00</div>
                        <div class="count-label">秒</div>
                    </div>
                </div>
            </div>

            <!-- 天气模块 -->
            <div class="info-card">
                <h3 class="card-title">🌤 今日天气</h3>
                <div class="card-text" id="weatherText">晴 26℃ ~ 33℃</div>
                <div class="small-text">江苏镇江 · 湿度52% · 微风2级</div>
            </div>
        </div>

        <footer>
            I LOVE MAYOYO © 2026
        </footer>
    </div>

    <script>
        // 1. 实时日期时间
        function updateTime() {
            const now = new Date();
            const weekArr = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
            const year = now.getFullYear();
            const month = String(now.getMonth()+1).padStart(2,'0');
            const day = String(now.getDate()).padStart(2,'0');
            const week = weekArr[now.getDay()];
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            const s = String(now.getSeconds()).padStart(2,'0');

            document.getElementById("nowTime").innerText = `${h}:${m}:${s}`;
            document.getElementById("nowDate").innerText = `${year}年${month}月${day}日 ${week}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 2. 倒计时（目标：2027-01-01 00:00:00）
        function countDown() {
            const target = new Date("2027-01-01 00:00:00");
            const now = new Date();
            const diff = target - now;
            if(diff <= 0) {
                document.getElementById("day").innerText = "00";
                document.getElementById("hour").innerText = "00";
                document.getElementById("min").innerText = "00";
                document.getElementById("sec").innerText = "00";
                return;
            }
            const d = Math.floor(diff / (1000*60*60*24));
            const h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const mi = Math.floor((diff % (1000*60*60)) / (1000*60));
            const se = Math.floor((diff % (1000*60)) / 1000);

            document.getElementById("day").innerText = String(d).padStart(2,'0');
            document.getElementById("hour").innerText = String(h).padStart(2,'0');
            document.getElementById("min").innerText = String(mi).padStart(2,'0');
            document.getElementById("sec").innerText = String(se).padStart(2,'0');
        }
        setInterval(countDown, 1000);
        countDown();
    </script>
</body>
</html>
