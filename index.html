<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>I LOVE MAYOYO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 全屏高度，弹性布局实现完美居中 */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }
        .text {
            /* 粉色字体，可自行修改字号 */
            color: #ff69b4;
            font-size: 60px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="text">I LOVE MAYOYO</div>
</body>
</html>
